name: CI

# Triggers are disabled to prevent automated runs on push/PR.
# You can manually trigger this workflow from the GitHub Actions tab (workflow_dispatch).
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Matrix Build & Test: Linux (GCC/Clang), Windows (MSVC), macOS (AppleClang)
  # ===========================================================================
  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu - GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            generator: "Unix Makefiles"
          - name: Ubuntu - Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            generator: "Unix Makefiles"
          - name: Windows - MSVC
            os: windows-latest
            cc: ""
            cxx: ""
            generator: "Visual Studio 17 2022"
          - name: macOS - AppleClang
            os: macos-latest
            cc: clang
            cxx: clang++
            generator: "Unix Makefiles"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DLOGSCAN_BUILD_TESTS=ON -DLOGSCAN_BUILD_BENCH=ON
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "${{ matrix.generator }}" -A x64 -DCMAKE_BUILD_TYPE=Release -DLOGSCAN_BUILD_TESTS=ON -DLOGSCAN_BUILD_BENCH=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Tests (ctest)
        run: ctest --test-dir build -C Release --output-on-failure

  # ===========================================================================
  # Sanitizer: AddressSanitizer (ASan) + UndefinedBehaviorSanitizer (UBSan)
  # ===========================================================================
  asan-ubsan:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake with ASan & UBSan
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DLOGSCAN_BUILD_TESTS=ON -DLOGSCAN_ENABLE_ASAN=ON

      - name: Build with ASan
        run: cmake --build build --parallel

      - name: Run Tests under ASan + UBSan
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: "detect_leaks=1:check_initialization_order=1:strict_init_order=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

  # ===========================================================================
  # Sanitizer: ThreadSanitizer (TSan)
  # ===========================================================================
  tsan:
    name: Sanitizers (TSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake with TSan
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DLOGSCAN_BUILD_TESTS=ON -DLOGSCAN_ENABLE_TSAN=ON

      - name: Build with TSan
        run: cmake --build build --parallel

      - name: Run Tests under TSan
        run: ctest --test-dir build --output-on-failure
        env:
          TSAN_OPTIONS: "second_deadlock_stack=1"
